<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群星计划 · 本地工作室</title><link rel="stylesheet" href="style.css"><style>body{padding:25px}.studio{display:grid;grid-template-columns:230px 1fr;gap:25px;max-width:1600px;margin:auto}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button{border:1px solid #bdcdc0;border-radius:6px;padding:9px 14px;background:#f4f7ef}button.primary{background:#315d60;color:white}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{border:1px solid #d3ddd2;background:#fff;padding:10px;width:100%;color:var(--ink);border-radius:5px}label{font-size:12px;display:block;line-height:2.3}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}textarea{height:55vh;font:14px/1.8 Consolas,monospace;resize:vertical}.list button{text-align:left;width:100%;margin-bottom:7px}.list .selected{background:#dce8dc}h1{font:24px var(--serif)}#status{font-size:12px}dialog{width:min(900px,95%);border:1px solid #bacdbe;border-radius:10px;padding:25px}#preview{max-height:70vh;overflow:auto}@media(max-width:800px){.studio,.editor-grid{grid-template-columns:1fr}.list{max-height:180px;overflow:auto}.fields{grid-template-columns:1fr}}</style><div class="studio"><aside><h1>✧ 群星工作室</h1><p class="caption">本地编辑 · 双语 Markdown</p><div class="tools"><button id="new">＋ 新文章</button><button id="groups">管理目录</button></div><div class="list" id="list"></div></aside><main><div class="tools"><button class="primary" id="save">保存并生成网站</button><button id="up">↑ 上移</button><button id="down">↓ 下移</button><button id="show">预览当前语言</button><a href="/" target="_blank">打开网站 ↗</a><span id="status" role="status"></span></div><div class="fields"><label>中文标题<input id="titleZh"></label><label>English title<input id="titleEn"></label><label>所属栏目<select id="category"></select></label><label>日期<input type="date" id="date"></label><label>编号<input id="code"></label><label>发布状态<select id="published"><option value="true">公开发布</option><option value="false">草稿（不进入发布产物）</option></select></label></div><div class="tools"><button id="zh">中文</button><button id="en">English</button><span class="caption">Markdown · $行内公式$ · $$独立公式$$ · Ctrl+S 保存</span></div><textarea id="body" aria-label="Markdown 正文" spellcheck="false"></textarea><p class="caption">目录与文章顺序可调整。保存写入本地 content 文件；推送到 GitHub 后自动发布。关闭前请先保存。</p></main></div><dialog id="modal"><button id="close">关闭 ×</button><div class="prose" id="preview"></div></dialog><script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]}};</script><script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script><script src="admin.js"></script></html>
